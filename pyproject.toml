[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multi-agentic-graph-rag"
version = "0.1.0"
description = "Local Streamlit application for grounded requirements, stories, and scenarios."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit>=1.60,<2",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/multi_agentic_graph_rag"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "C90",
    "DTZ",
    "G",
    "LOG",
    "PIE",
    "PT",
    "PTH",
    "RUF",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
